name: eureka-server CI/CD

on:
  push:
    branches: [ "test" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git repository checkout
        uses: actions/checkout@v4

      - name: permission for gradlew 권한 부여
        run: chmod +x gradlew

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        run: |
          docker build -t eureka-server:latest .
          docker tag eureka-server:latest ${{ secrets.EUREKA_ECR_URI }}:latest
          docker push ${{ secrets.EUREKA_ECR_URI }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EUREKA_EC2_HOST }}
          username: ${{ secrets.EUREKA_EC2_USER }}
          key: ${{ secrets.EUREKA_EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.EUREKA_ECR_URI }}:latest
            docker stop eureka-server || true
            docker rm eureka-server || true
            docker run -d \
              --name eureka-server \
              --env-file /home/ec2-user/eureka-server.env \
              -p 18080:18080 \
              ${{ secrets.EUREKA_ECR_URI }}:latest
